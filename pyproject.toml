[project]
name = "testomat-test"
version = "0.1.0"
description = "Playwright test project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker==40.12.0",
    "playwright==1.58.0",
    "pytest-html==4.2.0",
    "pytest-playwright==0.7.2",
    "pytest==9.0.2",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", ".claude", ".idea", "__pycache__", "build", "dist"]
base_url = "https://app.testomat.io"
addopts = """
    --headed
    -v
    -ra
    --strict-markers
    --tb=short
    --tracing=retain-on-failure
    --output=test-result/traces/
    --screenshot=on
    --html=test-result/report.html
    --self-contained-html
"""
markers = [
    "smoke: Quick smoke tests for basic functionality",
    "regression: Full regression test suite",
    "web: Web UI tests using Playwright",
    "slow: Tests that take longer to execute"
]
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "test-result",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]
fixable = ["ALL"]
unfixable = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
# Additional configuration for uv can be placed here if needed
